name: Onda CI

on:
  push:
  pull_request:

concurrency:
  group: onda-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Test FastAPI contract
        working-directory: backend
        run: python -m pytest

  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iOS simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable == true)] | first | .udid')
          test -n "$DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Run iOS unit and navigation tests
        run: |
          xcodebuild \
            -project Onda/Onda.xcodeproj \
            -scheme Onda \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -only-testing:OndaTests \
            -only-testing:OndaUITests/OndaUITests/testPrimaryNavigationFlow \
            -only-testing:OndaUITests/OndaUITests/testSecondaryNavigationDestinations \
            test
