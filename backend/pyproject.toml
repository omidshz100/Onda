[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onda-api"
version = "0.1.0"
description = "Versioned FastAPI backend for Onda meetings"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
